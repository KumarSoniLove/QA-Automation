name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Enables the manual "Run workflow" button inside the GitHub Actions UI
  workflow_dispatch: 

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      # Injects the correct sandbox variables and repository secrets securely into the CI machine environment
      env:       
        APP_BASE_URL: https://sandbox-app.brighthr.com
        AUTH_BASE_URL: https://sandbox-login.brighthr.com
        BRIGHTHR_EMAIL: ${{ secrets.BRIGHTHR_EMAIL }}
        BRIGHTHR_PASSWORD: ${{ secrets.BRIGHTHR_PASSWORD }}
      run: npx playwright test --project=chromium
      
    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: centralized-test-results
        # Routes directly to your centralized test reports and screenshot assets folder
        path: test-results/ 
        retention-days: 30
